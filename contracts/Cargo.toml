[workspace]
resolver = "2"
members = ["core", "verifier", "hasher", "pool", "disputes"]

[workspace.dependencies]
stylus-sdk = "=0.10.9"
alloy-primitives = "1"
alloy-sol-types = "1"
hex-literal = "0.4"
occulta-core = { path = "core" }

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
